
name: Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/spreadsheet-view
    paths:
      - 'vcpkg/**'
      - 'vcpkg.json'
      - 'VCPKG_BASELINE'
      - 'app/**'
      - 'core/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'cmake_templates/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-test.yml'

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: macos-26
    timeout-minutes: 360

    env:
      NDK_VERSION_FULL: r27c
      JDK_VERSION: '17'
      SDK_PLATFORM: android-36
      SDK_BUILD_TOOLS: 36.0.0
      CMAKE_VERSION: '4.3.2'
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear

    steps:
      - name: Checkout spreadsheet source
        uses: actions/checkout@v4
        with:
          path: mm

      - name: Install build dependencies
        run: |
          brew install gnupg automake bison flex gnu-sed \
            autoconf-archive libtool gettext lcov openssl mono

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.4.1'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION_FULL }}
          add-to-path: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: zulu

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          android sdk install \
            "platforms/${SDK_PLATFORM}" \
            "build-tools/${SDK_BUILD_TOOLS}" \
            platform-tools

      - name: Install vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_ROOT"
          cd "$VCPKG_ROOT"
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch origin master
          git checkout "$(cat "$GITHUB_WORKSPACE/mm/VCPKG_BASELINE")"
          ./bootstrap-vcpkg.sh

      - name: Calculate build number
        run: |
          echo "MM_VERSION_CODE=${GITHUB_RUN_NUMBER}${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Configure ARM64 Android app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake \
            -S "$GITHUB_WORKSPACE/mm" \
            -B "$GITHUB_WORKSPACE/build-mm" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_HOST_TRIPLET=arm64-osx \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALL_OPTIONS="--allow-unsupported" \
            -DANDROID_ABI=arm64-v8a \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            -DANDROID_NDK_VERSION="$ANDROID_NDK_VERSION" \
            -DANDROID_BUILD_TOOLS_VERSION="$SDK_BUILD_TOOLS" \
            -DQT_ANDROID_SIGN_APK=No \
            -DQT_ANDROID_SIGN_AAB=No \
            -DUSE_MM_SERVER_API_KEY=No \
            -DWITH_TRIMBLE_PROVIDERS=FALSE \
            -DUSE_KEYCHAIN=No

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --build "$GITHUB_WORKSPACE/build-mm" \
            --target apk --parallel 2

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$GITHUB_WORKSPACE/build-mm" \
            -type f -name '*.apk' -print

          APK_PATH="$(find "$GITHUB_WORKSPACE/build-mm" \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "APK tidak ditemukan setelah build."
            exit 1
          fi

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/apk-output/merginmaps-${GITHUB_RUN_NUMBER}-arm64-v8a.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerginMaps-Spreadsheet-ARM64-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
