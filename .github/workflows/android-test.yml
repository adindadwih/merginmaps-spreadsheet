
name: Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/spreadsheet-view
    paths:
      - 'app/**'
      - 'core/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'cmake_templates/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'VCPKG_BASELINE'
      - '.github/workflows/android-test.yml'

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDK_PLATFORM: android-35
      SDK_BUILD_TOOLS: 35.0.0
      NDK_VERSION: 27.2.12479018
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf-archive automake bison flex gettext \
            libtool lcov mono-complete ninja-build \
            pkg-config nasm zip unzip curl git \
            build-essential libgl1-mesa-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      
      
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "Menggunakan: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: Checkout vcpkg baseline
        run: |
          rm -rf "$VCPKG_ROOT"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(cat VCPKG_BASELINE)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Get Android overlay ports and triplets
        run: |
          git clone --depth 1 https://github.com/MerginMaps/mobile-sdk.git mobile-sdk
          test -d mobile-sdk/vcpkg-overlay/ports
          test -d mobile-sdk/vcpkg-overlay/triplets

      - name: Configure Android ARM64
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          cmake \
            -S . \
            -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/mobile-sdk/vcpkg-overlay/ports" \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/mobile-sdk/vcpkg-overlay/triplets" \
            -DVCPKG_INSTALL_OPTIONS="--allow-unsupported" \
            -DANDROID_ABI=arm64-v8a \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            -DUSE_MM_SERVER_API_KEY=FALSE \
            -DWITH_TRIMBLE_PROVIDERS=FALSE \
            -DQT_ANDROID_SIGN_APK=No

      - name: Build APK
        run: |
          cmake --build build-android --target apk --parallel 2
          find build-android -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-ARM64-APK
          path: build-android/**/*.apk
          if-no-files-found: error
